spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  mail:
    host: localhost
    port: 25
    username: test
    password: test

jwt:
  secret: testSecretKeyThatIsAtLeast256BitsLongForHS256AlgorithmTestingPurposes2024!
  expiration: 86400000

openai:
  api:
    key: test-api-key
    url: https://api.openai.com/v1/chat/completions
  model: gpt-4.1-nano

app:
  name: Library Management System Test
  base-url: http://localhost:8081
  frontend-url: http://localhost:5173
  email:
    from: test@example.com
    verification-token-expiry: 86400000
    password-reset-token-expiry: 3600000
  security:
    encoded-openai: "dGVzdC1rZXk="
    encoded-gmail: "dGVzdC1wYXNz"

logging:
  level:
    root: WARN
    com.library.library_management: DEBUG
